parse_report_task:
  description: >
    Parse one report into chunks, tag chunks by ESG domain, and persist retrievable chunk artifacts with tracing metadata.
  expected_output: >
    JSON-like structure with chunk ids, text spans, tags, and persistence location.
  agent: report_parser

environmental_scoring_task:
  description: >
    Score environmental performance using only retrieved preprocessed_content chunks.
    Explicitly evaluate strategy/processes, governance, and risk-management criteria from the environmental heuristics.
    Explain which criteria are evidenced vs missing. Use conservative scoring bands: 0-4 weak/absent, 5-8 basic, 9-12 moderate, 13-16 strong, 17-20 leading.
    Do not score above 12 unless evidence includes measurable targets and monitoring results.
  expected_output: >
    JSON object with keys: estimated_score, confidence, rationale, supported_criteria (list), missing_criteria (list).
  agent: environmental_analyst

social_scoring_task:
  description: >
    Score social performance using only retrieved preprocessed_content chunks.
    Explicitly evaluate strategy/processes, governance, and risk-management criteria from the social heuristics.
    Explain which criteria are evidenced vs missing. Use conservative scoring bands: 0-4 weak/absent, 5-8 basic, 9-12 moderate, 13-16 strong, 17-20 leading.
    Do not score above 12 unless evidence includes measurable targets and monitoring results.
  expected_output: >
    JSON object with keys: estimated_score, confidence, rationale, supported_criteria (list), missing_criteria (list).
  agent: social_analyst

governance_scoring_task:
  description: >
    Score governance performance using only retrieved preprocessed_content chunks.
    Explicitly evaluate governance-arrangement and governance-risk-management criteria from the governance heuristics.
    Explain which criteria are evidenced vs missing. Use conservative scoring bands: 0-4 weak/absent, 5-8 basic, 9-12 moderate, 13-16 strong, 17-20 leading.
    Do not score above 12 unless evidence includes measurable targets and monitoring results.
  expected_output: >
    JSON object with keys: estimated_score, confidence, rationale, supported_criteria (list), missing_criteria (list).
  agent: governance_analyst

aggregate_scores_task:
  description: >
    Aggregate E/S/G domain scores into total score and verify weighted consistency.
    If a domain score is high but rationale lacks explicit evidence coverage, flag calibration risk in notes.
  expected_output: >
    JSON object with weighted_total_score, consistency_checks, and calibration_risks.
  agent: score_aggregator

compare_performance_task:
  description: >
    Compare estimated score outputs with actual labels to compute absolute and percentage errors.
  expected_output: >
    Error report with absolute error, percentage error, and over/under direction.
  agent: performance_comparator

evaluate_metrics_task:
  description: >
    Evaluate coverage, accuracy, consistency, inter-agent agreement, latency/efficiency, hallucination, and deliberation quality.
  expected_output: >
    Metrics summary suitable for cross-pattern comparison.
  agent: metrics_evaluator
